<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Monopoli</title>
    <style>
      :root {
        --bg: #e9efe6;
        --fg: #1b2a1f;
        --card: #fff;
        --line: #2b3a2e;
        --cc: #cfe8d0;
        --mut: #5a6b5e;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121a14;
          --fg: #e8f0ea;
          --card: #1d2a21;
          --line: #8fa595;
          --cc: #2a4132;
          --mut: #9db3a2;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #121a14;
        --fg: #e8f0ea;
        --card: #1d2a21;
        --line: #8fa595;
        --cc: #2a4132;
        --mut: #9db3a2;
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      .wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 8px;
        justify-content: center;
        max-width: 1150px;
        margin: auto;
      }
      .board {
        flex: 1 1 360px;
        max-width: 680px;
        aspect-ratio: 1;
        container-type: inline-size;
        display: grid;
        grid-template: 1.5fr repeat(9, 1fr) 1.5fr/1.5fr repeat(9, 1fr) 1.5fr;
        border: 2px solid var(--line);
        background: var(--cc);
      }
      .cell {
        border: 1px solid var(--line);
        background: var(--card);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        font-size: max(6px, 1.25cqw);
        text-align: center;
        line-height: 1.1;
        padding: 1px;
        min-width: 0;
      }
      .cell b {
        font-weight: 600;
        word-break: break-word;
      }
      .bar {
        display: block;
        width: 100%;
        height: 1.8cqw;
        min-height: 4px;
      }
      .tk {
        font-size: max(9px, 2.2cqw);
        line-height: 1;
      }
      .ctr {
        grid-area: 2/2/11/11;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2cqw;
        text-align: center;
        padding: 2cqw;
      }
      .ctr h1 {
        margin: 0;
        font-size: 6cqw;
        letter-spacing: 0.3cqw;
        color: #c62828;
      }
      .dice {
        font-size: 11cqw;
        line-height: 1;
      }
      .msg {
        margin: 0;
        font-size: max(11px, 2.3cqw);
        color: var(--fg);
        max-width: 90%;
      }
      .panel {
        flex: 1 1 300px;
        max-width: 420px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
      }
      button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--cc);
        color: var(--fg);
        cursor: pointer;
        margin: 3px;
      }
      button.pri {
        background: #2e7d32;
        color: #fff;
        border-color: #2e7d32;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pl {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-radius: 8px;
        flex-wrap: wrap;
      }
      .pl.on {
        background: var(--cc);
        outline: 2px solid #2e7d32;
      }
      .pl.out {
        opacity: 0.4;
        text-decoration: line-through;
      }
      .pl s {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        text-decoration: none;
        border: 1px solid var(--line);
      }
      .lg {
        font-size: 13px;
        color: var(--mut);
        margin: 0;
        padding-left: 16px;
      }
      #md {
        position: fixed;
        inset: 0;
        background: #0008;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9;
      }
      .box {
        background: var(--card);
        color: var(--fg);
        padding: 14px;
        border-radius: 12px;
        max-width: 420px;
        width: 92%;
        max-height: 80vh;
        overflow: auto;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
      }
      select,
      input {
        font: inherit;
        max-width: 100%;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap"
    />
    <style>
      :root {
        --bg: #f4efe6;
        --fg: #1d1b16;
        --card: #fffdf8;
        --line: #b8a477;
        --cc: #efe6d2;
        --mut: #6f6650;
        --gold: #b8892b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1411;
          --fg: #f1ead8;
          --card: #17211b;
          --line: #6c5a2e;
          --cc: #1d2b23;
          --mut: #a89f86;
          --gold: #e2b94f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1411;
        --fg: #f1ead8;
        --card: #17211b;
        --line: #6c5a2e;
        --cc: #1d2b23;
        --mut: #a89f86;
        --gold: #e2b94f;
      }
      body {
        background: radial-gradient(ellipse at top, var(--cc), var(--bg) 70%)
          fixed;
        font-family: Inter, system-ui, sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: Cinzel, Georgia, serif;
      }
      .board {
        border: 3px solid var(--gold);
        border-radius: 14px;
        box-shadow: 0 12px 40px #0005;
        background: radial-gradient(circle, var(--card), var(--cc));
        overflow: hidden;
      }
      .cell {
        background: linear-gradient(160deg, var(--card), var(--cc));
        border-color: var(--line);
      }
      .ctr h1 {
        color: var(--gold);
        font-size: 7cqw;
        text-shadow: 0 0.3cqw 0.8cqw #0004;
        letter-spacing: 0.8cqw;
        font-weight: 800;
      }
      .card {
        border-radius: 14px;
        border-color: var(--line);
        box-shadow: 0 4px 18px #0002;
      }
      button {
        border-radius: 999px;
        border-color: var(--gold);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px #0003;
      }
      button.pri {
        background: linear-gradient(135deg, #d4a63a, #a87a1e);
        color: #fff;
        border-color: #a87a1e;
        text-shadow: 0 1px 1px #0004;
      }
      button.big {
        display: block;
        width: 250px;
        margin: 9px auto;
        padding: 12px 18px;
        font-size: 16px;
      }
      .pl.on {
        outline-color: var(--gold);
      }
      .tk {
        font-size: max(11px, 2.8cqw);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      .tk span {
        display: inline-block;
        filter: drop-shadow(0 2px 2px #0006);
      }
      .tk span.cur {
        filter: drop-shadow(0 0 6px var(--gold));
      }
      .tk span.hop {
        animation: hop 0.19s ease-out;
      }
      @keyframes hop {
        50% {
          transform: translateY(-70%) scale(1.5);
        }
      }
      .dice {
        display: flex;
        gap: 2cqw;
        font-size: inherit;
      }
      .die {
        width: 8.5cqw;
        height: 8.5cqw;
        background: #fff;
        border-radius: 1.6cqw;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        padding: 1.1cqw;
        box-shadow:
          0 0.6cqw 1.2cqw #0005,
          inset 0 -0.4cqw 0 #0002;
      }
      .die i.on {
        background: #1b1b1b;
        border-radius: 50%;
        margin: 8%;
      }
      #menu {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #1f3b2d, #0a1410 75%);
        color: #f1ead8;
        overflow: hidden;
        text-align: center;
      }
      #fl span {
        position: absolute;
        bottom: -60px;
        opacity: 0.25;
        animation: fy linear infinite;
      }
      @keyframes fy {
        to {
          transform: translateY(-115vh) rotate(360deg);
        }
      }
      .mc {
        position: relative;
        animation: rise 0.9s ease-out;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
      }
      .mc h1 {
        font-size: clamp(40px, 10vw, 72px);
        margin: 0;
        color: #e2b94f;
        letter-spacing: 0.15em;
      }
      .mc h2 {
        margin: 0 0 6px;
        letter-spacing: 0.5em;
        font-weight: 600;
      }
      .logo {
        font-size: 64px;
        animation: bob 2.4s ease-in-out infinite;
      }
      @keyframes bob {
        50% {
          transform: translateY(-10px) rotate(8deg);
        }
      }
      .slot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px;
        border-radius: 12px;
        background: var(--cc);
        margin: 6px 0;
      }
      .slot > div {
        flex: 1;
      }
      .slot input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
      }
      .av {
        font-size: 30px;
        padding: 4px 10px;
        border-radius: 14px;
      }
      .sc {
        max-width: 440px;
        width: 100%;
        margin: auto;
      }
      .sm {
        font-size: 13px;
        color: var(--mut);
      }
      .tb {
        text-align: right;
      }
      :root {
        --bg: #eef1f6;
        --fg: #141824;
        --card: #fff;
        --line: #d9dfeb;
        --cc: #e7ecf5;
        --mut: #667089;
        --gold: #6c5ce7;
        --ac2: #00b3a4;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0f1a;
          --fg: #e8ecf7;
          --card: #141b2d;
          --line: #26314d;
          --cc: #1a2340;
          --mut: #8b96b3;
          --gold: #8b7bff;
          --ac2: #2dd4bf;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0f1a;
        --fg: #e8ecf7;
        --card: #141b2d;
        --line: #26314d;
        --cc: #1a2340;
        --mut: #8b96b3;
        --gold: #8b7bff;
        --ac2: #2dd4bf;
      }
      body {
        background:
          radial-gradient(
            900px 500px at 10% -10%,
            color-mix(in srgb, var(--gold) 22%, transparent),
            transparent
          ),
          radial-gradient(
            800px 500px at 100% 0,
            color-mix(in srgb, var(--ac2) 18%, transparent),
            transparent
          ),
          var(--bg) fixed;
      }
      h1,
      h2,
      h3 {
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
      }
      .board {
        gap: 3px;
        padding: 5px;
        border: 0;
        border-radius: 22px;
        background: linear-gradient(145deg, var(--cc), var(--card));
        box-shadow:
          0 20px 50px #0003,
          0 0 0 1px var(--line);
      }
      .cell {
        border: 0;
        border-radius: 8px;
        background: var(--card);
        box-shadow:
          0 1px 3px #0002,
          inset 0 0 0 1px var(--line);
      }
      .bar {
        border-radius: 0 0 4px 4px;
      }
      .ctr {
        border-radius: 16px;
        background: radial-gradient(
          circle at 50% 30%,
          color-mix(in srgb, var(--gold) 14%, transparent),
          transparent 70%
        );
      }
      .ctr h1 {
        color: transparent;
        background: linear-gradient(90deg, var(--gold), var(--ac2));
        -webkit-background-clip: text;
        background-clip: text;
        letter-spacing: 0.6cqw;
        text-shadow: none;
      }
      .msg {
        background: color-mix(in srgb, var(--card) 70%, transparent);
        padding: 1cqw 2cqw;
        border-radius: 99px;
        backdrop-filter: blur(6px);
      }
      .card {
        background: color-mix(in srgb, var(--card) 85%, transparent);
        backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 8px 30px #0002;
      }
      button {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 12px;
        font-weight: 600;
      }
      button.pri {
        background: linear-gradient(135deg, var(--gold), var(--ac2));
        border: 0;
        color: #fff;
        text-shadow: none;
        box-shadow: 0 6px 18px color-mix(in srgb, var(--gold) 40%, transparent);
      }
      .pl {
        border-radius: 12px;
      }
      .pl.on {
        background: color-mix(in srgb, var(--gold) 16%, transparent);
        outline: 2px solid var(--gold);
      }
      .slot {
        background: var(--cc);
        border-radius: 14px;
      }
      #menu {
        background:
          radial-gradient(700px 500px at 20% 10%, #4b3fd1aa, transparent),
          radial-gradient(700px 500px at 90% 90%, #0ea5a0aa, transparent),
          #0a0e1a;
      }
      .mc h1 {
        background: linear-gradient(90deg, #a99bff, #5eead4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .mc h2 {
        color: #cbd3ee;
      }
      .box {
        border-radius: 18px;
        box-shadow: 0 20px 60px #0006;
      }
      #pp {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 8;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        pointer-events: none;
        width: min(92vw, 360px);
      }
      .pm {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 14px;
        border-radius: 14px;
        color: #fff;
        font-size: 15px;
        box-shadow: 0 8px 24px #0004;
        animation:
          pin 0.3s ease-out,
          pout 0.4s 2.2s forwards;
      }
      .pm small {
        display: block;
        opacity: 0.85;
        font-size: 12px;
      }
      .pm.up {
        background: linear-gradient(135deg, #10b981, #059669);
      }
      .pm.dn {
        background: linear-gradient(135deg, #f43f5e, #be123c);
      }
      @keyframes pin {
        from {
          opacity: 0;
          transform: translateY(-14px) scale(0.95);
        }
      }
      @keyframes pout {
        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }
      #game {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        height: 100dvh;
        box-sizing: border-box;
        padding: 6px;
      }
      #game .board {
        width: min(calc(100dvh - 12px), calc(100vw - 300px), 920px);
        max-width: none;
        flex: none;
      }
      .sd {
        display: flex;
        flex-direction: column;
        gap: 6px;
        justify-content: center;
        max-height: 100%;
        overflow: auto;
        min-width: 0;
      }
      .pc {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 6px 8px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--card) 88%, transparent);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-left: 5px solid var(--pc);
        transition: 0.2s;
        font-size: 13px;
        min-width: 0;
      }
      .pc.on {
        transform: scale(1.04);
        box-shadow:
          0 0 0 2px var(--gold),
          0 8px 20px #0004;
      }
      .pc.out {
        opacity: 0.35;
        filter: grayscale(1);
      }
      .pa {
        font-size: 26px;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--pc);
        flex: none;
      }
      .pc b {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pc .mo {
        font-weight: 700;
        color: var(--ac2);
      }
      .pp2 s {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin: 1px;
        border: 1px solid #0003;
      }
      .mb {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 6px);
        right: 6px;
        z-index: 4;
        padding: 6px 10px;
      }
      .tk span {
        background: var(--pc);
        border-radius: 50%;
        padding: 0.08em 0.12em;
        box-shadow: 0 0 0 1.5px #fffa;
      }
      #ac {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }
      #ac button {
        font-size: max(11px, 2.6cqw);
        padding: 0.8cqw 2cqw;
        margin: 0.4cqw;
      }
      .turn {
        width: 100%;
        font-size: max(11px, 2.4cqw);
        font-weight: 700;
        color: var(--gold);
      }
      #pp {
        top: 36%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(60vw, 300px);
      }
      .pm {
        font-size: 14px;
        padding: 7px 12px;
      }
      #nm {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 4px 8px;
      }
      .sc {
        max-width: 640px;
      }
      .cds {
        display: flex;
        gap: 4px;
        margin-top: 4px;
        flex-wrap: wrap;
      }
      .cd {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .cd.sel {
        border-color: var(--fg);
        transform: scale(1.2);
      }
      #menu {
        overflow: auto;
      }
      .mc h2 {
        color: inherit;
      }
      @media (max-height: 480px) {
        .logo {
          display: none;
        }
        .mc h1 {
          font-size: 38px;
        }
        .mc p {
          display: none;
        }
        button.big {
          display: inline-block;
          width: 190px;
          margin: 4px;
        }
        .mc {
          max-width: 420px;
        }
        .pc {
          padding: 3px 6px;
          font-size: 11px;
        }
        .pa {
          width: 30px;
          height: 30px;
          font-size: 18px;
        }
      }
      @media (max-width: 760px) and (orientation: portrait) {
        #game {
          grid-template-columns: 1fr 1fr;
          height: auto;
          min-height: 100dvh;
          align-items: start;
        }
        #game .board {
          grid-column: 1/3;
          grid-row: 1;
          width: calc(100vw - 12px);
          margin: auto;
        }
        #pl1 {
          grid-row: 2;
          grid-column: 1;
        }
        #pl2 {
          grid-row: 2;
          grid-column: 2;
        }
        .sd {
          max-height: none;
        }
      }
      #bw {
        position: relative;
      }
      #pp {
        position: absolute;
        top: 37%;
        left: 50%;
        transform: translateX(-50%);
        width: 64%;
        max-width: 300px;
      }
      .box:has(.tg2) {
        max-width: 640px;
      }
      .qs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .qc {
        border-left: 5px solid var(--pc);
        display: flex;
        flex-direction: column;
        text-align: left;
        padding: 4px 10px;
      }
      .qc.on {
        background: color-mix(in srgb, var(--gold) 22%, transparent);
        outline: 2px solid var(--gold);
      }
      .qc small {
        color: var(--mut);
        font-weight: 400;
      }
      .tg2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .tg2 h4 {
        margin: 0 0 6px;
      }
      .tl {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 34dvh;
        overflow: auto;
        margin-bottom: 6px;
      }
      .tc {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        border-radius: 10px;
        border: 1px solid var(--line);
        cursor: pointer;

          (over ? "" : `<div class="turn">${p.t} Giliran ${p.n}</div>`) + b;
        side();
        logUI();
        const _x =
          `<div class="tb"><button onclick="pause()">☰ Menu</button></div>` +
          `<div class="card"><b>${over ? "Permainan selesai" : "Giliran: " + p.t + " " + p.n}</b>${over ? "" : " — " + fm(p.m) + (p.j ? " 🔒 di penjara" : "")}<div>${b}</div></div>` +
          `<div class="card">${P.map((q, i) => `<div class="pl ${i == cur && !over ? "on" : ""} ${q.out ? "out" : ""}">${q.t} <b>${q.n}</b> ${fm(Math.floor(q.m))} ${B.map((c, k) => (own[k] == i ? `<s style="background:${c[1] == "p" ? G[c[3]] : "#888"}"></s>` : "")).join("")}</div>`).join("")}</div>` +
          `<div class="card"><ol class="lg" reversed>${lg.map((x) => `<li>${x}</li>`).join("")}</ol></div>`;
        P.forEach((q, i) => {
          const m = Math.round(q.m);
          if (pm[i] !== undefined && m !== pm[i]) popM(q, m - pm[i]);
          pm[i] = m;
        });
        if (over && !wonS) {
          wonS = 1;
          snd("win");
        }
        if (!over && p.bot && !busy) {
          clearTimeout(bt);
          bt = setTimeout(botAct, 900);
        }
        if (over)
          modal(
            `<h2>🏆 ${w[0].n} menang!</h2><p>Semua lawan sudah bangkrut.</p><button class="pri" onclick="location.reload()">Main Lagi</button>`,
          );
      }
    </script>
